[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv", "runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Privacy/telemetry environment controls intentionally run before provider imports.
"app.py" = ["E402"]
